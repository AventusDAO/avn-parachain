name: Cargo Check

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        description: 'Machine type where the workflow will be run'
        default: gh-ubuntu-2404-x64

permissions:
  contents: read

jobs:
  cargo-check:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Restore cargo cache - common
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ inputs.runs_on }}-cargo-common-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore cargo cache - test
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            target/
          key: ${{ inputs.runs_on }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Code
        run: cargo check --locked
