name: Cargo Check

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        description: 'Machine type where the workflow will be run'
        default: gh-ubuntu-2404-x64

permissions:
  contents: read

jobs:
  cargo-check:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 90
    env:
      # Highest-priority rustup selector: beats stale directory overrides on the
      # runner, the repo's rust-toolchain.toml, and the rustup default.
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Restore cargo cache - common
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ inputs.runs_on }}-cargo-common-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore cargo cache - test
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/
          key: ${{ inputs.runs_on }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Code
        run: cargo check --locked
