name: Cargo Test

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        description: 'Machine type where the workflow will be run'
        default: gh-ubuntu-2404-x64

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2023-05-22
          components: rustfmt, clippy

      - name: Restore cargo cache - common
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ inputs.runs_on }}-cargo-common-${{ hashFiles('**/Cargo.lock') }}

      - name: Linting check
        run: cargo fmt --all --check

  test:
    name: Test Code
    runs-on: ${{ inputs.runs_on }}
    needs: ci
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Restore cargo cache - common
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ inputs.runs_on }}-cargo-common-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore cargo cache - test
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            target/
          key: ${{ inputs.runs_on }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Test Code
        run: cargo test -- --skip test_genesis_config_builds

  runtime-benchmarks:
    name: Runtime Benchmarks
    runs-on: ${{ inputs.runs_on }}
    needs: ci
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Restore cargo cache - common
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ inputs.runs_on }}-cargo-common-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore cargo cache - runtime benchmarks
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            target/
          key: ${{ inputs.runs_on }}-runtime-benchmarks-${{ hashFiles('**/Cargo.lock') }}

      # Since polkadot-stable2509, `pallet-xcm/runtime-benchmarks` pulls in `pallet-revive-fixtures`,
      # whose build script compiles Solidity fixtures and needs `solc` and `resolc` on the PATH.
      # Versions match the pair pinned by polkadot-sdk's own release pipeline for this SDK version.
      # The binaries are verified against pinned sha256 digests before they are made executable.
      - name: Install solc and resolc
        env:
          SOLC_VERSION: "0.8.30"
          SOLC_SHA256: "f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7"
          RESOLC_VERSION: "0.3.0"
          RESOLC_SHA256: "07a468d6ca8defa35ef73094339f5a051d2eeb53213c50ab4e6e4062c5f1ea34"
        run: |
          set -euo pipefail
          curl -Lsf --show-error -o "$HOME/.cargo/bin/solc" \
            "https://github.com/ethereum/solidity/releases/download/v${SOLC_VERSION}/solc-static-linux"
          curl -Lsf --show-error -o "$HOME/.cargo/bin/resolc" \
            "https://github.com/paritytech/revive/releases/download/v${RESOLC_VERSION}/resolc-x86_64-unknown-linux-musl"

          echo "${SOLC_SHA256}  $HOME/.cargo/bin/solc" | sha256sum --check --strict -
          echo "${RESOLC_SHA256}  $HOME/.cargo/bin/resolc" | sha256sum --check --strict -

          chmod +x "$HOME/.cargo/bin/solc" "$HOME/.cargo/bin/resolc"
          solc --version
          resolc --version

      - name: Runtime Benchmarks
        run: cargo test --features runtime-benchmarks -- benchmarks
