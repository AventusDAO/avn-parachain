# This workflow is used to create git tags and releases with all needed artefacts automatically from a branch
# If RELEASE is set to true, a git release will be created, with all needed artefacts.
# If RELEASE is set to false, only build and push a docker image to the ECR with the commit hash
name: CI Manual

on:
  workflow_dispatch:
    inputs:
      RELEASE:
        required: true
        type: boolean
        description: Should we create a git release? Use it if it's a hotfix
      GIT_TAG:
        required: false
        type: string
        description: which tag do you want to create?
      TEST_CODE:
        required: true
        type: boolean
        description: Should we run the tests ?

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-up-job:
    runs-on: ubuntu-latest
    outputs:
      RELEASE: ${{ steps.set.outputs.RELEASE }}
      GIT_TAG: ${{ steps.set.outputs.GIT_TAG }}
      TEST_CODE: ${{ steps.set.outputs.TEST_CODE }}
    steps:
      # GIT_TAG is free text typed by whoever dispatches the workflow. It is validated
      # against a strict allowlist BEFORE anything is written to $GITHUB_OUTPUT: a value
      # containing a newline could otherwise append extra records (such as RELEASE=true)
      # and change downstream job conditions. The same allowlist keeps it a valid git tag
      # and docker tag. RELEASE and TEST_CODE are booleans rendered by GitHub itself.
      - name: Validate inputs and set outputs
        id: set
        env:
          RELEASE: ${{ inputs.RELEASE }}
          GIT_TAG: ${{ inputs.GIT_TAG }}
          TEST_CODE: ${{ inputs.TEST_CODE }}
        run: |
          set -euo pipefail

          allowed='^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          prod='^v([0-9]+\.){0,2}(\*|[0-9]+)$'

          if [[ -n "$GIT_TAG" && ! "$GIT_TAG" =~ $allowed ]]; then
            echo "::error::GIT_TAG must start with an alphanumeric character and contain only [A-Za-z0-9._-] (max 128 chars)."
            exit 1
          fi

          if [[ "$GIT_TAG" =~ $prod ]]; then
            echo "::error::GIT_TAG '$GIT_TAG' matches the semver scheme 'vX.Y.Z' reserved for production tags. This workflow can only be used without prod tags."
            exit 1
          fi

          if [[ "$RELEASE" == "true" && -z "$GIT_TAG" ]]; then
            echo "::error::GIT_TAG is required when RELEASE is true."
            exit 1
          fi

          echo "Release: $RELEASE"
          echo "Git tag: $GIT_TAG"
          echo "Test code: $TEST_CODE"

          {
            echo "RELEASE=$RELEASE"
            echo "GIT_TAG=$GIT_TAG"
            echo "TEST_CODE=$TEST_CODE"
          } >> "$GITHUB_OUTPUT"

  test-code:
    needs: [set-up-job]
    if: ${{ needs.set-up-job.outputs.TEST_CODE == 'true' }}
    uses: ./.github/workflows/cargo-test.yml

  build-code:
    needs: [ set-up-job ]
    uses: ./.github/workflows/cargo-build.yml
    with:
      upload_artifacts: true
    secrets: inherit

  build-docker:
    needs: [ set-up-job, build-code, test-code ]
    if: |
      always() &&
      needs.build-code.result == 'success' &&
      (
        needs.set-up-job.outputs.TEST_CODE == 'false' ||
        needs.test-code.result == 'success'
      )
    uses: ./.github/workflows/docker-build.yml
    with:
      release: ${{ needs.set-up-job.outputs.RELEASE }}
      docker_tag: ${{ needs.set-up-job.outputs.GIT_TAG }}
    secrets: inherit

  release:
    needs: [ set-up-job, build-code, build-docker ]
    if: |
      always() &&
      (needs.set-up-job.outputs.RELEASE == 'true') &&
      (needs.build-code.result == 'success') &&
      (needs.build-docker.result == 'success')
    permissions:
      contents: write
    uses: ./.github/workflows/gh-release.yml
    with:
      repo_tag: ${{ needs.set-up-job.outputs.GIT_TAG }}
      hotfix: true
    secrets: inherit

  upload-assets-internal-tools:
    needs: [ set-up-job, build-code ]
    if: ${{ needs.set-up-job.outputs.RELEASE == 'true' }}
    uses: ./.github/workflows/s3-upload.yml
    with:
      bucket_name: "s3://aventus-internal-artefact/avn-parachain-node-artefacts"
      repo_tag: ${{ needs.set-up-job.outputs.GIT_TAG }}
    secrets: inherit
