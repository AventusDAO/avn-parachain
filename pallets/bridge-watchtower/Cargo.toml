[package]
name = "pallet-bridge-watchtower"
publish = false

version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = "GPL-3.0"

[dependencies]
# Third-party
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-info = { workspace = true, features = ["derive", "serde"]}
log = { workspace = true }

# Substrate primitives
sp-core = { workspace = true}
sp-io = { workspace = true}
sp-runtime = { workspace = true}
sp-std = { workspace = true}

frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }

pallet-avn = { workspace = true }
sp-avn-common = { workspace = true }
sp-watchtower = { workspace = true }
pallet-watchtower = { workspace = true }

[dev-dependencies]
pallet-node-manager = { workspace = true, features = ["default"] }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "log/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "sp-std/std",
    "frame-benchmarking?/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-avn/std",
    "sp-avn-common/std",
    "sp-watchtower/std",
    "pallet-watchtower/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "pallet-avn/runtime-benchmarks",
    "sp-avn-common/runtime-benchmarks",
    "pallet-watchtower/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "pallet-avn/try-runtime",
    "pallet-watchtower/try-runtime",
]
